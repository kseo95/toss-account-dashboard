<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토스증권 포트폴리오 대시보드</title>
<style>
  :root {
    --bg: #0d1117;
    --border: #30363d;
    --text: #e6edf3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>토스증권 포트폴리오</h1>
</header>
</body>
</html>
