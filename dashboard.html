<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토스증권 포트폴리오 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
  :root {
    --bg: #0d1117;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --card: #161b22;
    --accent: #3b82f6;
    --danger: #e66767;
    --profit: #4fae5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  #fxDisplay { color: var(--muted); font-size: 12px; }
  #logoutBtn {
    display: none;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #logoutBtn:hover { color: var(--text); border-color: var(--muted); }

  main {
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  #loginCard {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    align-self: flex-start;
  }
  #loginCard h2 { font-size: 16px; margin: 0 0 4px; }
  #loginCard p.hint { color: var(--muted); font-size: 12px; margin: 0 0 20px; line-height: 1.5; }
  #loginCard label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #loginCard input {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  #loginCard input:focus { outline: none; border-color: var(--accent); }
  #loginCard button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #loginCard button:disabled { opacity: 0.6; cursor: default; }
  #loginError {
    display: none;
    color: var(--danger);
    font-size: 12px;
    margin-top: 4px;
    margin-bottom: 10px;
  }

  #connectedView { display: none; width: 100%; max-width: 860px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .card h2 .sub { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .currency-toggle {
    display: inline-flex;
    margin-left: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    vertical-align: middle;
  }
  .currency-toggle button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    padding: 3px 12px;
    cursor: pointer;
  }
  .currency-toggle button + button { border-left: 1px solid var(--border); }
  .currency-toggle button.active { background: var(--accent); color: #fff; }

  #summaryCards { display: flex; gap: 12px; margin-bottom: 16px; }
  #summaryCards .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  #summaryCards .stat .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #summaryCards .stat .value { font-size: 18px; font-weight: 700; }

  /* 두 도넛을 동시에 보여주면 legend 길이 차이 때문에 크기/정렬이 서로 달라 보여서,
     탭으로 하나씩만 보여주는 방식으로 바꿈 - 비교할 대상이 없어지므로 문제 자체가 사라짐. */
  .chart-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .chart-tabs .chart-tab {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .chart-tabs .chart-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chart-tabs .chart-tab:not(.active):hover { color: var(--text); border-color: var(--muted); }
  .chart-wrap { position: relative; height: 260px; } /* 두 차트가 항상 같은 크기로 그려지도록 고정 높이 */
  .chart-wrap canvas { width: 100% !important; height: 100% !important; }

  .profit { color: var(--profit); }
  .loss { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tbody tr:last-child td { border-bottom: none; }
  .empty-row td { color: var(--muted); text-align: left; }

  details.settings summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    user-select: none;
  }
  details.settings summary:hover { color: var(--text); }
  .cash-symbol-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .cash-symbol-row .name { color: var(--muted); }
  .cash-symbol-row .unheld-tag { color: var(--muted); font-size: 11px; }
  .cash-symbol-row button.unset {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 5px; padding: 2px 8px; font-size: 11px; cursor: pointer; margin-left: auto;
  }
  .cash-symbol-row button.unset:hover { color: var(--danger); border-color: var(--danger); }
  #saveCashSymbolsBtn {
    margin-top: 12px; padding: 7px 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  #saveCashSymbolsBtn:disabled { opacity: 0.6; cursor: default; }
  #cashSymbolsSaved { color: var(--muted); font-size: 12px; margin-left: 10px; display: none; }

  .rb-category-row {
    display: grid;
    grid-template-columns: 1fr 2fr 80px auto;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
  }
  .rb-category-row input {
    padding: 6px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    width: 100%;
  }
  .rb-category-row input:focus { outline: none; border-color: var(--accent); }
  .rb-category-row button.rb-remove {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 5px; padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
  .rb-category-row button.rb-remove:hover { color: var(--danger); border-color: var(--danger); }
  .rb-add {
    margin-top: 8px; background: transparent; border: 1px dashed var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; width: 100%;
  }
  .rb-add:hover { color: var(--text); border-color: var(--muted); }
  .rb-rest-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .rb-rest-row input { width: 80px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
  .rb-hint { color: var(--muted); font-size: 11px; }
  .rb-sum { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .rb-sum.warn { color: var(--danger); }
  .rb-error { display: none; color: var(--danger); font-size: 12px; margin-bottom: 8px; }
  .rb-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .rb-actions button { padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  #saveRebalanceBtn { background: var(--accent); color: #fff; border: none; }
  #saveRebalanceBtn:disabled { opacity: 0.6; cursor: default; }
  #resetRebalanceBtn { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  #resetRebalanceBtn:hover { color: var(--text); border-color: var(--muted); }
  #rebalanceSaved { color: var(--muted); font-size: 12px; display: none; }
</style>
</head>
<body>
<header>
  <h1>토스증권 포트폴리오</h1>
  <div class="header-right">
    <span id="fxDisplay"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</header>
<main>
  <div id="loginCard">
    <h2>토스증권 계좌 연결</h2>
    <p class="hint">토스증권 Open API 개발자센터에서 발급받은 앱키/시크릿을 입력하세요.<br>서버 메모리에만 보관되며 파일로 저장하지 않습니다.</p>
    <div id="loginError"></div>
    <label for="appKey">앱키 (App Key)</label>
    <input id="appKey" type="password" autocomplete="off" spellcheck="false">
    <label for="appSecret">시크릿 (App Secret)</label>
    <input id="appSecret" type="password" autocomplete="off" spellcheck="false">
    <button id="loginBtn">로그인</button>
  </div>

  <div id="connectedView">
    <div id="dashboardError" style="display:none; color: var(--danger); background: var(--card); border: 1px solid var(--danger); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px;"></div>
    <div id="summaryCards">
      <div class="stat"><div class="label">총 평가금액 (예수금 포함)</div><div class="value" id="totalEval">-</div></div>
      <div class="stat"><div class="label">총 손익</div><div class="value" id="totalPl">-</div></div>
      <div class="stat"><div class="label">총 수익률</div><div class="value" id="totalRate">-</div></div>
    </div>

    <div class="card">
      <div class="chart-tabs">
        <button type="button" class="chart-tab active" data-tab="alloc">보유 비중</button>
        <button type="button" class="chart-tab" data-tab="currency">원/달러 비율</button>
      </div>

      <div id="allocTabPanel" class="chart-tab-panel">
        <div class="chart-wrap"><canvas id="allocChart"></canvas></div>

        <details class="settings">
          <summary>리밸런싱 목표 설정</summary>
          <div id="rebalanceError" class="rb-error"></div>
          <div id="rebalanceCategories"></div>
          <button id="addCategoryBtn" type="button" class="rb-add">+ 카테고리 추가</button>
          <div class="rb-rest-row">
            <label for="restPctInput">미분류 종목 기본 목표%(각각)</label>
            <input id="restPctInput" type="number" min="0" max="100" step="0.1">
          </div>
          <div id="rebalanceSum" class="rb-sum"></div>
          <div class="rb-actions">
            <button id="saveRebalanceBtn">저장</button>
            <button id="resetRebalanceBtn" type="button">되돌리기</button>
            <span id="rebalanceSaved">저장됨</span>
          </div>
        </details>
      </div>

      <div id="currencyTabPanel" class="chart-tab-panel" style="display:none;">
        <div class="chart-wrap"><canvas id="currencyChart"></canvas></div>

        <details class="settings">
          <summary>원/달러 목표 비중 설정</summary>
          <div id="currencyTargetError" class="rb-error"></div>
          <div class="rb-rest-row">
            <label for="krwTargetInput">목표 원화 비중%</label>
            <input id="krwTargetInput" type="number" min="0" max="100" step="0.1">
            <span id="usdTargetHint" class="rb-hint"></span>
          </div>
          <div class="rb-actions">
            <button id="saveCurrencyTargetBtn">저장</button>
            <span id="currencyTargetSaved" class="rb-hint" style="display:none;">저장됨</span>
          </div>
        </details>
      </div>
    </div>

    <div class="card">
      <h2>현금</h2>
      <table><thead><tr>
        <th>항목</th><th>금액(원)</th>
      </tr></thead><tbody id="cashRows"></tbody></table>

      <details class="settings">
        <summary>현금 취급 종목 설정</summary>
        <div id="cashSymbolPicker" style="margin-top:10px;"></div>
        <button id="saveCashSymbolsBtn">저장</button>
        <span id="cashSymbolsSaved">저장됨</span>
      </details>
    </div>

    <div class="card">
      <h2>국내 종목</h2>
      <table><thead><tr>
        <th>종목</th><th>수량</th><th>평가금액(원)</th><th>손익(원)</th><th>수익률(%)</th><th>지분율(%)</th>
      </tr></thead><tbody id="krRows"></tbody></table>
    </div>

    <div class="card">
      <h2>해외 종목<span class="currency-toggle" id="usCurrencyToggle"><button type="button" data-mode="krw" class="active">원</button><button type="button" data-mode="usd">$</button></span></h2>
      <table><thead><tr>
        <th>종목</th><th>수량</th><th id="usEvalHeader">평가금액(원)</th><th id="usPlHeader">손익(원)</th><th>수익률(%)</th><th>지분율(%)</th>
      </tr></thead><tbody id="usRows"></tbody></table>
    </div>
  </div>
</main>

<script>
const loginCard = document.getElementById('loginCard');
const connectedView = document.getElementById('connectedView');
const logoutBtn = document.getElementById('logoutBtn');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const appKeyInput = document.getElementById('appKey');
const appSecretInput = document.getElementById('appSecret');

const totalEvalEl = document.getElementById('totalEval');
const totalPlEl = document.getElementById('totalPl');
const totalRateEl = document.getElementById('totalRate');
const krRows = document.getElementById('krRows');
const usRows = document.getElementById('usRows');
const cashRows = document.getElementById('cashRows');
const cashSymbolPicker = document.getElementById('cashSymbolPicker');
const saveCashSymbolsBtn = document.getElementById('saveCashSymbolsBtn');
const cashSymbolsSaved = document.getElementById('cashSymbolsSaved');

let cashSymbolsDraft = new Set();   // 현금 취급 종목 설정 (체크박스 화면용 임시 상태)
let heldSymbolsInfo = [];           // 현재 보유 중인 전체 종목 [{심볼, 종목, 수량}]

function showError(msg) {
  loginError.textContent = msg;
  loginError.style.display = 'block';
}

function showLoggedIn() {
  loginCard.style.display = 'none';
  connectedView.style.display = 'block';
  logoutBtn.style.display = 'inline-block';
}

function showLoggedOut() {
  loginCard.style.display = 'block';
  connectedView.style.display = 'none';
  logoutBtn.style.display = 'none';
}

function fmtWon(n) {
  return Math.round(n).toLocaleString('ko-KR') + '원';
}
// 헤더의 환율 표시 (real/dashboard.html과 같은 형식): "USD/KRW 1,391.20   USD/JPY 147.33 (Yahoo Finance 23:17 기준)"
function renderFxDisplay(usdKrw, usdJpy) {
  let text = `USD/KRW ${usdKrw.toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
  if (usdJpy) {
    text += `   USD/JPY ${usdJpy.rate.toLocaleString('en-US', { maximumFractionDigits: 2 })} (${usdJpy.source} ${usdJpy.as_of} 기준)`;
  }
  document.getElementById('fxDisplay').textContent = text;
}
function fmtUsd(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(n) {
  const sign = n > 0 ? '+' : '';
  return sign + n.toFixed(2) + '%';
}
function signClass(n) {
  return n > 0 ? 'profit' : (n < 0 ? 'loss' : '');
}

// 국내/해외 종목 표에 공통으로 쓰는 셀 마크업 (종목명+심볼, 수량 / 수익률·지분율).
function symbolQtyCells(r) {
  return `
    <td>${r['종목']} <span style="color:var(--muted)">(${r['심볼']})</span></td>
    <td>${r['수량'].toLocaleString('ko-KR')}</td>
  `;
}
function rateShareCells(r) {
  return `
    <td class="${signClass(r['수익률(%)'])}">${fmtPct(r['수익률(%)'])}</td>
    <td>${r['지분율(%)'].toFixed(2)}%</td>
  `;
}

function renderStockRows(tbody, rows) {
  tbody.innerHTML = '';
  if (!rows.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">보유 종목이 없습니다.</td></tr>';
    return;
  }
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      ${symbolQtyCells(r)}
      <td>${fmtWon(r['평가금액(원)'])}</td>
      <td class="${signClass(r['손익(원)'])}">${fmtWon(r['손익(원)'])}</td>
      ${rateShareCells(r)}
    `;
    tbody.appendChild(tr);
  });
}

// 해외 종목 표: 원/$ 토글에 따라 평가금액·손익 컬럼 값을 바꿔서 보여준다(재조회 없이 캐시된 데이터로 다시 그림).
let usCurrencyMode = 'krw';   // 'krw' | 'usd'
let lastUsStocks = [];

// ---------- 보유 비중 도넛 / 원-달러 비율 도넛 ----------
// dataviz 스킬의 검증된 다크모드 카테고리 팔레트 (real/dashboard.html과 동일한 값 재사용).
const CAT_PALETTE = [
  '#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767',
  '#76589d', '#8f5d04', '#0c71a0',
];
const CASH_COLOR = '#898781'; // "현금"은 실제 종목이 아니라서 중립색
let allocChart, currencyChart;

// real/dashboard.html과 같은 방식: Chart.js 내장 legend(아래쪽, 클릭하면 조각 토글) + generateLabels로
// "현재% / 목표%" 텍스트를 붙인다. 오른쪽이 아니라 아래쪽으로 둔 이유: 두 도넛이 나란히 좁은 박스에 있어서
// 오른쪽에 두면 legend가 폭을 많이 먹어 도넛이 심하게 찌그러짐 - 아래쪽이 그나마 덜함(완전히 같은 크기까지는
// 보장 못 함).
function donutOptions(generateLabels) {
  return {
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'right',
        labels: { color: '#e6edf3', boxWidth: 12, generateLabels },
        onClick: (e, item, legend) => {
          if (item.extra) return; // 목표만 있고 도넛 조각이 없는(0%) 항목은 토글할 게 없음
          Chart.overrides.doughnut.plugins.legend.onClick.call(legend, e, item, legend);
        },
      },
      datalabels: {
        color: '#0d1117',
        font: { weight: 'bold', size: 12 },
        formatter: v => (v >= 1 ? v.toFixed(1) + '%' : ''),
      },
    },
  };
}

// 리밸런싱 목표 카테고리별 현재%/목표%. 카테고리로 안 묶인 종목+예수금은 "나머지"(전부 현금성이면 "현금")로
// 뭉쳐서 표시됨(개별로 보고 싶으면 종목 하나짜리 카테고리를 만들면 됨) - real/과 동일한 방식.
let lastRebalance = [];

function categoryColorFor(rebalance, label) {
  if (label === '나머지' || label === '현금') return CASH_COLOR;
  const nonCash = rebalance.filter(r => r.label !== '나머지' && r.label !== '현금');
  const idx = nonCash.findIndex(r => r.label === label);
  return CAT_PALETTE[idx % CAT_PALETTE.length];
}

// 범례: "분류  현재% / 목표%". 현재 0%(도넛에 조각 없음)인 카테고리는 회색으로 범례에만 추가.
function allocLegendLabels(chart) {
  const fmt = v => (Math.round(v * 10) / 10) + '%';
  const byLabel = Object.fromEntries(lastRebalance.map(r => [r.label, r]));
  const base = Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart);
  const shownLabels = new Set(base.map(it => it.text));
  base.forEach(it => {
    const r = byLabel[it.text];
    if (r) it.text = `${it.text}  ${fmt(r.current_pct)} / ${fmt(r.target_pct)}`;
  });
  const extras = lastRebalance
    .filter(r => !shownLabels.has(r.label) && r.target_pct > 0)
    .sort((a, b) => b.target_pct - a.target_pct)
    .map(r => ({
      text: `${r.label}  0% / ${fmt(r.target_pct)}`,
      fillStyle: categoryColorFor(lastRebalance, r.label),
      strokeStyle: categoryColorFor(lastRebalance, r.label),
      fontColor: '#8b949e',
      hidden: false,
      extra: true,
    }));
  return base.concat(extras);
}

function renderAllocChart(rebalance) {
  lastRebalance = rebalance;
  const shown = rebalance
    .filter(r => r.current_pct > 0.01) // 아직 안 산(0%) 카테고리는 도넛엔 안 나오고 범례에만 남김
    .sort((a, b) => b.current_pct - a.current_pct); // 보유 비중 내림차순
  const labels = shown.map(r => r.label);
  const values = shown.map(r => r.current_pct);
  const colors = shown.map(r => categoryColorFor(rebalance, r.label));

  if (!allocChart) {
    allocChart = new Chart(document.getElementById('allocChart'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: colors }] },
      plugins: [ChartDataLabels],
      options: donutOptions(allocLegendLabels),
    });
  } else {
    allocChart.data.labels = labels;
    allocChart.data.datasets[0].data = values;
    allocChart.data.datasets[0].backgroundColor = colors;
    allocChart.update();
  }
}

let lastCurrencySplit = { krw_pct: 0, usd_pct: 0, krw_target_pct: 0, usd_target_pct: 0 };

function currencyLegendLabels(chart) {
  const fmt = v => (Math.round(v * 10) / 10) + '%';
  const byLabel = {
    '원화': { pct: lastCurrencySplit.krw_pct, target: lastCurrencySplit.krw_target_pct },
    '달러': { pct: lastCurrencySplit.usd_pct, target: lastCurrencySplit.usd_target_pct },
  };
  const base = Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart);
  base.forEach(it => {
    const r = byLabel[it.text];
    if (r) it.text = `${it.text}  ${fmt(r.pct)} / ${fmt(r.target)}`;
  });
  return base;
}

function renderCurrencyChart(split) {
  lastCurrencySplit = split;
  const items = [
    { label: '원화', pct: split.krw_pct, color: '#3987e5' },
    { label: '달러', pct: split.usd_pct, color: '#199e70' },
  ].sort((a, b) => b.pct - a.pct); // 보유 비중 내림차순
  const labels = items.map(it => it.label);
  const values = items.map(it => it.pct);
  const colors = items.map(it => it.color);

  if (!currencyChart) {
    currencyChart = new Chart(document.getElementById('currencyChart'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: colors }] },
      plugins: [ChartDataLabels],
      options: donutOptions(currencyLegendLabels),
    });
  } else {
    currencyChart.data.labels = labels;
    currencyChart.data.datasets[0].data = values;
    currencyChart.update();
  }
}

// ---------- 리밸런싱 목표 설정 편집 ----------
// 카테고리로 안 묶인 종목/예수금은 하나로 뭉치지 않고 각각 개별 항목으로 표시되며,
// 목표%는 전부 이 "기본 목표%"(default_rest_target_pct) 값으로 고정된다.
let rebalanceDraft = { targets: [], default_rest_target_pct: 5, krw_target_pct: 50 };

function updateRebalanceSum() {
  const categorySum = rebalanceDraft.targets.reduce((s, t) => s + (parseFloat(t.target_pct) || 0), 0);
  const el = document.getElementById('rebalanceSum');
  el.textContent = `카테고리 목표% 합계: ${Math.round(categorySum * 10) / 10}% (미분류 종목/예수금은 위 "기본 목표%"로 각각 표시됩니다)`;
  el.classList.remove('warn'); // 미분류 종목 개수가 유동적이라 100% 기준 경고는 의미가 없음

  const krwTarget = parseFloat(document.getElementById('krwTargetInput').value) || 0;
  document.getElementById('usdTargetHint').textContent = `(달러 목표: ${Math.round((100 - krwTarget) * 10) / 10}%)`;
}

function renderRebalancePanel() {
  const container = document.getElementById('rebalanceCategories');
  container.innerHTML = '';
  rebalanceDraft.targets.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'rb-category-row';
    const escLabel = (t.label || '').replace(/"/g, '&quot;');
    row.innerHTML = `
      <input type="text" placeholder="카테고리 이름" value="${escLabel}" data-field="label">
      <input type="text" placeholder="종목 코드 (쉼표로 구분, 예: 069500, 114800)" value="${t.symbols.join(', ')}" data-field="symbols">
      <input type="number" min="0" max="100" step="0.1" value="${t.target_pct}" data-field="target_pct">
      <button type="button" class="rb-remove">삭제</button>
    `;
    row.querySelector('[data-field="label"]').addEventListener('input', e => { rebalanceDraft.targets[i].label = e.target.value; });
    row.querySelector('[data-field="symbols"]').addEventListener('input', e => {
      rebalanceDraft.targets[i].symbols = e.target.value.split(/[,\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
    });
    row.querySelector('[data-field="target_pct"]').addEventListener('input', e => {
      rebalanceDraft.targets[i].target_pct = parseFloat(e.target.value) || 0;
      updateRebalanceSum();
    });
    row.querySelector('.rb-remove').addEventListener('click', () => {
      rebalanceDraft.targets.splice(i, 1);
      renderRebalancePanel();
    });
    container.appendChild(row);
  });
  document.getElementById('restPctInput').value = rebalanceDraft.default_rest_target_pct;
  document.getElementById('krwTargetInput').value = rebalanceDraft.krw_target_pct;
  updateRebalanceSum();
}

async function loadRebalanceConfig() {
  const res = await fetch('/api/rebalance-config');
  if (!res.ok) return;
  const data = await res.json();
  rebalanceDraft = {
    targets: (data.targets || []).map(t => ({ ...t, symbols: [...t.symbols] })),
    default_rest_target_pct: data.default_rest_target_pct,
    krw_target_pct: data.krw_target_pct,
  };
  renderRebalancePanel();
}

document.getElementById('restPctInput').addEventListener('input', updateRebalanceSum);
document.getElementById('krwTargetInput').addEventListener('input', updateRebalanceSum);

document.getElementById('addCategoryBtn').addEventListener('click', () => {
  rebalanceDraft.targets.push({ label: '', symbols: [], target_pct: 0 });
  renderRebalancePanel();
});

document.getElementById('resetRebalanceBtn').addEventListener('click', () => {
  loadRebalanceConfig();
});

// 카테고리 설정("보유 비중" 카드)과 원/달러 목표("원/달러 비율" 카드)는 같은 rebalance.json 하나를
// 공유하는 서로 다른 화면일 뿐이라, 저장 로직은 공용으로 쓰고 어느 버튼을 눌렀든 전체를 같이 저장한다.
async function saveRebalanceSettings(errElId, savedElId, btnId) {
  const errEl = document.getElementById(errElId);
  const savedEl = document.getElementById(savedElId);
  const btn = document.getElementById(btnId);
  errEl.style.display = 'none';
  savedEl.style.display = 'none';
  btn.disabled = true;
  try {
    const res = await fetch('/api/rebalance-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        targets: rebalanceDraft.targets,
        default_rest_target_pct: parseFloat(document.getElementById('restPctInput').value) || 0,
        krw_target_pct: parseFloat(document.getElementById('krwTargetInput').value) || 0,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || '저장에 실패했습니다.';
      errEl.style.display = 'block';
      return;
    }
    rebalanceDraft = {
      targets: data.targets.map(t => ({ ...t, symbols: [...t.symbols] })),
      default_rest_target_pct: data.default_rest_target_pct,
      krw_target_pct: data.krw_target_pct,
    };
    renderRebalancePanel();
    savedEl.style.display = 'inline';
    await loadHoldings(); // 저장된 목표를 도넛/범례에 바로 반영
  } catch (e) {
    errEl.textContent = '서버에 연결할 수 없습니다.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('saveRebalanceBtn').addEventListener('click', () => {
  saveRebalanceSettings('rebalanceError', 'rebalanceSaved', 'saveRebalanceBtn');
});
document.getElementById('saveCurrencyTargetBtn').addEventListener('click', () => {
  saveRebalanceSettings('currencyTargetError', 'currencyTargetSaved', 'saveCurrencyTargetBtn');
});

function renderUsRows(rows, mode) {
  lastUsStocks = rows;
  document.getElementById('usEvalHeader').textContent = mode === 'usd' ? '평가금액($)' : '평가금액(원)';
  document.getElementById('usPlHeader').textContent = mode === 'usd' ? '손익($)' : '손익(원)';

  usRows.innerHTML = '';
  if (!rows.length) {
    usRows.innerHTML = '<tr class="empty-row"><td colspan="6">보유 종목이 없습니다.</td></tr>';
    return;
  }
  rows.forEach(r => {
    const evalVal = mode === 'usd' ? r['평가금액(외화)'] : r['평가금액(원)'];
    const plVal = mode === 'usd' ? r['손익(외화)'] : r['손익(원)'];
    const fmtEval = evalVal == null ? '-' : (mode === 'usd' ? fmtUsd(evalVal) : fmtWon(evalVal));
    const fmtPl = plVal == null ? '-' : (mode === 'usd' ? fmtUsd(plVal) : fmtWon(plVal));
    const tr = document.createElement('tr');
    tr.innerHTML = `
      ${symbolQtyCells(r)}
      <td>${fmtEval}</td>
      <td class="${signClass(plVal || 0)}">${fmtPl}</td>
      ${rateShareCells(r)}
    `;
    usRows.appendChild(tr);
  });
}

document.querySelectorAll('#usCurrencyToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    usCurrencyMode = btn.dataset.mode;
    document.querySelectorAll('#usCurrencyToggle button').forEach(b => b.classList.toggle('active', b === btn));
    renderUsRows(lastUsStocks, usCurrencyMode);
  });
});

function renderCashTable(cash) {
  cashRows.innerHTML = '';
  const rows = [];
  if (cash.krw) rows.push(['예수금 (원화)', cash.krw]);
  if (cash.usd) rows.push([`예수금 (달러, ${fmtUsd(cash.usd)} · 환율 ${cash.usd_krw_rate.toFixed(2)})`, cash.usd * cash.usd_krw_rate]);
  (cash.stocks || []).forEach(r => rows.push([`${r['종목']} (${r['심볼']})`, r['평가금액(원)']]));

  if (!rows.length) {
    cashRows.innerHTML = '<tr class="empty-row"><td colspan="2">현금이 없습니다.</td></tr>';
  } else {
    rows.forEach(([label, amount]) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${label}</td><td>${fmtWon(amount)}</td>`;
      cashRows.appendChild(tr);
    });
  }
  const totalTr = document.createElement('tr');
  totalTr.innerHTML = `<td><strong>합계</strong></td><td><strong>${fmtWon(cash.total_krw)}</strong></td>`;
  cashRows.appendChild(totalTr);
}

function renderCashSymbolPicker() {
  cashSymbolPicker.innerHTML = '';
  const heldSymbols = new Set(heldSymbolsInfo.map(s => s.심볼));

  // 1) 현재 보유 중인 종목: 체크박스로 선택
  heldSymbolsInfo.forEach(s => {
    const row = document.createElement('label');
    row.className = 'cash-symbol-row';
    const checked = cashSymbolsDraft.has(s.심볼);
    row.innerHTML = `
      <input type="checkbox" data-symbol="${s.심볼}" ${checked ? 'checked' : ''}>
      <span>${s.종목}</span>
      <span class="name">(${s.심볼}, ${s.수량.toLocaleString('ko-KR')}주)</span>
    `;
    row.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) cashSymbolsDraft.add(s.심볼);
      else cashSymbolsDraft.delete(s.심볼);
    });
    cashSymbolPicker.appendChild(row);
  });

  // 2) 설정은 돼 있지만 지금은 미보유인 종목: 해제 버튼만 제공 (0주로 남아있는 상태)
  [...cashSymbolsDraft].filter(sym => !heldSymbols.has(sym)).forEach(sym => {
    const row = document.createElement('div');
    row.className = 'cash-symbol-row';
    row.innerHTML = `
      <span>${sym}</span>
      <span class="unheld-tag">미보유 · 0주 · 설정만 남아있음</span>
      <button class="unset" type="button">해제</button>
    `;
    row.querySelector('button').addEventListener('click', () => {
      cashSymbolsDraft.delete(sym);
      renderCashSymbolPicker();
    });
    cashSymbolPicker.appendChild(row);
  });

  if (!heldSymbolsInfo.length && cashSymbolsDraft.size === 0) {
    cashSymbolPicker.innerHTML = '<div style="color:var(--muted)">보유 종목이 없습니다.</div>';
  }
}

saveCashSymbolsBtn.addEventListener('click', async () => {
  saveCashSymbolsBtn.disabled = true;
  cashSymbolsSaved.style.display = 'none';
  try {
    const res = await fetch('/api/cash-symbols', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbols: [...cashSymbolsDraft] }),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || '저장에 실패했습니다.');
      return;
    }
    cashSymbolsSaved.style.display = 'inline';
    await loadHoldings(); // 현금/종목 표 다시 계산해서 반영
  } finally {
    saveCashSymbolsBtn.disabled = false;
  }
});

async function loadHoldings() {
  const dashboardError = document.getElementById('dashboardError');
  let holdingsRes, cashSymbolsRes;
  try {
    [holdingsRes, cashSymbolsRes] = await Promise.all([
      fetch('/api/holdings'),
      fetch('/api/cash-symbols'),
    ]);
  } catch (e) {
    dashboardError.textContent = '서버에 연결할 수 없습니다.';
    dashboardError.style.display = 'block';
    return;
  }

  if (holdingsRes.status === 401) {
    // 세션이 실제로 만료/무효화된 경우에만 로그인 화면으로 되돌아간다.
    showLoggedOut();
    return;
  }
  if (!holdingsRes.ok) {
    // 401이 아닌 실패(토스 API 오류 등)는 로그인 화면으로 돌리지 않고 에러만 보여준다.
    const err = await holdingsRes.json().catch(() => ({}));
    dashboardError.textContent = err.error || `보유종목 조회에 실패했습니다 (${holdingsRes.status}).`;
    dashboardError.style.display = 'block';
    return;
  }
  dashboardError.style.display = 'none';
  const data = await holdingsRes.json();
  const cashSymbolsData = cashSymbolsRes.ok ? await cashSymbolsRes.json() : { symbols: [] };

  const krStocks = data.stocks.filter(r => r['시장'] === 'KR');
  const usStocks = data.stocks.filter(r => r['시장'] !== 'KR');
  renderStockRows(krRows, krStocks);
  renderUsRows(usStocks, usCurrencyMode);
  renderCashTable(data.cash);
  renderAllocChart(data.rebalance);
  renderCurrencyChart(data.currency_split);
  renderFxDisplay(data.usd_krw, data.usd_jpy);

  totalEvalEl.textContent = fmtWon(data.totals.eval_krw);
  totalPlEl.textContent = fmtWon(data.totals.profit_loss_krw);
  totalPlEl.className = 'value ' + signClass(data.totals.profit_loss_krw);
  totalRateEl.textContent = fmtPct(data.totals.rate_pct);
  totalRateEl.className = 'value ' + signClass(data.totals.rate_pct);

  heldSymbolsInfo = [...data.stocks, ...data.cash.stocks].map(r => ({ 심볼: r['심볼'], 종목: r['종목'], 수량: r['수량'] }));
  cashSymbolsDraft = new Set(cashSymbolsData.symbols || []);
  renderCashSymbolPicker();
}

async function enterDashboard() {
  showLoggedIn();
  await Promise.all([loadHoldings(), loadRebalanceConfig()]);
}

async function checkSession() {
  const res = await fetch('/api/session');
  const data = await res.json();
  if (data.logged_in) {
    await enterDashboard();
  } else {
    showLoggedOut();
  }
}

loginBtn.addEventListener('click', async () => {
  loginError.style.display = 'none';
  const app_key = appKeyInput.value.trim();
  const app_secret = appSecretInput.value.trim();
  if (!app_key || !app_secret) {
    showError('앱키와 시크릿을 모두 입력하세요.');
    return;
  }
  loginBtn.disabled = true;
  loginBtn.textContent = '연결 중...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_key, app_secret }),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || '로그인에 실패했습니다.');
      return;
    }
    appKeyInput.value = '';
    appSecretInput.value = '';
    await enterDashboard();
  } catch (e) {
    showError('서버에 연결할 수 없습니다.');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = '로그인';
  }
});

logoutBtn.addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  showLoggedOut();
});

appSecretInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

// 보유 비중 / 원-달러 비율 탭 전환. 숨겨져 있던 캔버스가 다시 보일 때 Chart.js가 크기를
// 다시 계산하도록 resize()를 호출해준다(안 하면 크기가 0으로 남아있을 수 있음).
document.querySelectorAll('.chart-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.chart-tab').forEach(t => t.classList.toggle('active', t === tab));
    const showAlloc = tab.dataset.tab === 'alloc';
    document.getElementById('allocTabPanel').style.display = showAlloc ? '' : 'none';
    document.getElementById('currencyTabPanel').style.display = showAlloc ? 'none' : '';
    if (showAlloc && allocChart) allocChart.resize();
    if (!showAlloc && currencyChart) currencyChart.resize();
  });
});

checkSession();
</script>
</body>
